<!doctype html>
<html lang="or">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AaaS — Odia TTS demo</title>
    <style>
      /* Odia conjuncts break if you use `letter-spacing`; use
         `word-spacing` instead. Line-height ≥ 1.7 keeps matras legible. */
      :root {
        --bg: #0e1116;
        --panel: #1a1f27;
        --fg: #e8edf2;
        --muted: #8b96a5;
        --accent: #4da3ff;
        --accent-hover: #72b6ff;
        --error: #ff7a7a;
        --ok: #7bd88f;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.7;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 3rem 1.25rem 4rem;
      }
      main {
        width: 100%;
        max-width: 720px;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
      }
      .sub {
        color: var(--muted);
        margin-bottom: 1.5rem;
      }
      .panel {
        background: var(--panel);
        border: 1px solid #262d38;
        border-radius: 14px;
        padding: 1.25rem 1.25rem 1rem;
      }
      textarea {
        width: 100%;
        min-height: 10rem;
        background: #0b0e13;
        color: var(--fg);
        border: 1px solid #2a3240;
        border-radius: 10px;
        padding: 0.9rem 1rem;
        font-family: "Noto Sans Oriya", "Kalinga", system-ui, sans-serif;
        font-size: 1.15rem;
        line-height: 1.85;
        resize: vertical;
      }
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .row {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-top: 1rem;
        flex-wrap: wrap;
      }
      button {
        background: var(--accent);
        color: #0a0f18;
        border: 0;
        border-radius: 8px;
        padding: 0.7rem 1.1rem;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: var(--accent-hover); }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      button.secondary {
        background: transparent;
        color: var(--fg);
        border: 1px solid #37404f;
      }
      .status {
        margin-top: 0.9rem;
        min-height: 1.4rem;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .status.error { color: var(--error); }
      .status.ok    { color: var(--ok); }
      audio {
        width: 100%;
        margin-top: 0.75rem;
      }
      .samples {
        margin-top: 1rem;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .samples button {
        background: #22293a;
        color: var(--fg);
        font-weight: 500;
        font-size: 0.92rem;
        padding: 0.45rem 0.8rem;
      }
      .samples button:hover { background: #2b3347; }
      footer {
        margin-top: 1.25rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
      code {
        background: #0b0e13;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AaaS — ଓଡ଼ିଆ TTS ଡେମୋ</h1>
      <p class="sub">
        Offline neural voice (Meta MMS-TTS-ory) running on this laptop.
        No cloud, no internet.
      </p>

      <div class="panel">
        <label for="text" style="display:block; margin-bottom:0.4rem;">
          Type or paste Odia text
        </label>
        <textarea id="text" spellcheck="false">ନମସ୍କାର। ମୁଁ ଓଡ଼ିଶା ସରକାରଙ୍କ ଏକ ଉଦ୍ୟୋଗ। ଆପଣଙ୍କୁ କେମିତି ସହଯୋଗ କରିପାରିବି?</textarea>

        <div class="samples" aria-label="Sample phrases">
          <button type="button" data-sample="ନମସ୍କାର, ଆପଣଙ୍କୁ ସ୍ୱାଗତ।">ନମସ୍କାର</button>
          <button type="button" data-sample="ଆଜି ଭୁବନେଶ୍ୱରରେ ପାଣିପାଗ ଭଲ ଅଛି।">Weather</button>
          <button type="button" data-sample="ଉତ୍କଳ ବିଶ୍ୱବିଦ୍ୟାଳୟ ଓଡ଼ିଶାର ଏକ ପୁରାତନ ଶିକ୍ଷାନୁଷ୍ଠାନ।">University</button>
        </div>

        <div class="row">
          <button id="speak" type="button">🔊 Read aloud</button>
          <button id="download" class="secondary" type="button" disabled>Download WAV</button>
          <span class="status" id="status">Ready</span>
        </div>

        <audio id="player" controls preload="none"></audio>
      </div>

      <footer>
        Endpoint: <code id="endpoint">http://127.0.0.1:8001/synthesise</code>
        &nbsp;·&nbsp; <span id="meta">—</span>
      </footer>
    </main>

    <script>
      const API = window.AAAS_TTS_URL || "http://127.0.0.1:8001";
      const $ = (id) => document.getElementById(id);
      const textEl = $("text");
      const statusEl = $("status");
      const audioEl = $("player");
      const speakBtn = $("speak");
      const downloadBtn = $("download");
      const metaEl = $("meta");
      $("endpoint").textContent = `${API}/synthesise`;

      let lastBlobUrl = null;

      function setStatus(msg, kind) {
        statusEl.textContent = msg;
        statusEl.className = "status" + (kind ? " " + kind : "");
      }

      document.querySelectorAll("[data-sample]").forEach((b) =>
        b.addEventListener("click", () => {
          textEl.value = b.dataset.sample;
          textEl.focus();
        })
      );

      async function synthesise() {
        const text = textEl.value.trim();
        if (!text) {
          setStatus("Please enter some Odia text first.", "error");
          return;
        }
        speakBtn.disabled = true;
        downloadBtn.disabled = true;
        setStatus("Synthesising…");
        const started = performance.now();
        try {
          const response = await fetch(`${API}/synthesise`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          if (!response.ok) {
            const body = await response.text();
            throw new Error(`HTTP ${response.status}: ${body}`);
          }
          const audioSeconds = parseFloat(
            response.headers.get("x-audio-duration") || "0"
          );
          const blob = await response.blob();
          if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
          lastBlobUrl = URL.createObjectURL(blob);
          audioEl.src = lastBlobUrl;
          await audioEl.play();
          const wall = ((performance.now() - started) / 1000).toFixed(2);
          const rtf = audioSeconds > 0
            ? (parseFloat(wall) / audioSeconds).toFixed(2)
            : "∞";
          setStatus(`Done in ${wall}s (audio ${audioSeconds.toFixed(2)}s, RTF ${rtf})`, "ok");
          metaEl.textContent = `${(blob.size / 1024).toFixed(0)} kB WAV · ${audioSeconds.toFixed(2)} s audio`;
          downloadBtn.disabled = false;
        } catch (err) {
          setStatus(`Failed: ${err.message}`, "error");
        } finally {
          speakBtn.disabled = false;
        }
      }

      speakBtn.addEventListener("click", synthesise);
      textEl.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") synthesise();
      });
      downloadBtn.addEventListener("click", () => {
        if (!lastBlobUrl) return;
        const a = document.createElement("a");
        a.href = lastBlobUrl;
        a.download = "aaas-odia.wav";
        a.click();
      });
    </script>
  </body>
</html>
