[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aaas-translate"
version = "0.1.0"
description = "AaaS Translation service — Indic↔English (AI4Bharat IndicTrans2), FastAPI, pluggable engines."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "SUBARNAREKHA" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    # /ocr accepts multipart uploads; the route is always registered,
    # so this rides in base deps (pure-python, tiny) not the [ocr] extra.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
indic = [
    "torch>=2.4",
    # IndicTrans2's bundled modeling code targets transformers 4.x: 5.x removed
    # transformers.onnx (breaks its tokenizer) and changed the KV-cache contract
    # its decoder assumes. Pin <5 until the model repo is updated.
    "transformers>=4.46,<5",
    "sentencepiece>=0.2",
    # Pure-Python Devanagari<->native-script transliteration for IndicTrans2
    # pre/post-processing — the script step IndicProcessor does, without the
    # Cython IndicTransToolkit (which needs a C++ build toolchain).
    "indic-nlp-library>=0.92",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]
# OCR for scanned notices (/ocr). pytesseract is a thin wrapper around
# the external `tesseract` binary (winget: UB-Mannheim.TesseractOCR);
# pypdfium2 ships its own pdfium, no system deps. Kept out of base
# deps so the lean bundle build stays lean — the engine lazy-imports
# and falls back to a mock when anything is missing.
ocr = [
    "pytesseract>=0.3.13",
    "pypdfium2>=4.30",
    "Pillow>=10",
]
bundle = [
    "pyinstaller>=6.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
