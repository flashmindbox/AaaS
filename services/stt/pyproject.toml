[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aaas-stt"
version = "0.1.0"
description = "AaaS Speech-to-Text service — Odia + English, FastAPI, pluggable engines (mock, IndicWav2Vec, faster-whisper)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "SUBARNAREKHA" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "numpy>=1.26",
    "soundfile>=0.12",
    "av>=12.0",
]

[project.optional-dependencies]
indic = [
    "torch>=2.4",
    "transformers>=4.46",
    "torchaudio>=2.4",
]
whisper = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]
bundle = [
    "pyinstaller>=6.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
