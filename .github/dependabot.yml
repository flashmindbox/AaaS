version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      radix:
        patterns: ['@radix-ui/*']
      eslint:
        patterns: ['eslint*', '@typescript-eslint/*']
      testing:
        patterns: ['vitest*', '@testing-library/*', 'playwright*', '@axe-core/*', 'jest-axe']
      types:
        patterns: ['@types/*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: '/infra'
    schedule:
      interval: monthly
